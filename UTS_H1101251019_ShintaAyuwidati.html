<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>No 3 Konversi Nilai</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: #98f4e5;
        }
        header {
            background-color: #400909;
            color: white;
            text-align: center;
            padding: 20px;
        }
        main {
            width: 400px;
            margin: 30px auto;
        }
        section {
            background-color: white;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }
        
        input {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
            margin-top: 8px;
            margin-bottom: 15px;
        }
        button {
            padding: 10px 15px;
            margin-right: 5px;
            border: none;
            cursor: pointer;
        }
        #hasil_konve {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
        }
        footer {
            text-align: center;
            margin-top: 30px;
        }
    @media (max-width: 500px) {
            main {
                width: 90%;
            }
        }
    </style>
</head>
<body>
    <header>
        <h1>Konversi Nilai</h1>
        <h3>Nama: Shinta Ayuwidati</h3>
        <h3>NIM: H1101251019</h3>
        <p>Kelas: Praktikum Pemograman Dasar A</p>
    </header>

    <main>
        <section>
            <h2>Masukkan Nilai Mahasiswa</h2>
            <label for="nilai_mahasiswa">Nilai:</label>
            <input type="number" id="nilai_mahasiswa" min="0" max="100">
            <button onclick="konversiNilai()">Konversi</button>
            <button onclick="resetNilai()">Reset</button>

            <p id="hasil_konve"></p>
        </section>
    </main>
 <footer>
    <p>Pengkonversi Nilai menjadi Abjad</p>
 </footer>

 <script>
        function konversiNilai() {
            let nilai = Number(document.getElementById("nilai_mahasiswa").value);
            let hasil = document.getElementById("hasil_konve");

            if (isNaN(nilai) || nilai < 0 || nilai > 100) {
                hasil.textContent = "Nilai minimal adalah 0 dan Nilai maksimal adalah 100";
                hasil.style.color = "red";
                return;
            }
            if (nilai >= 85) {
                hasil.textContent = "Nilai A";
                hasil.style.color = "green";
            } else {
                if (nilai >= 75) {
                    hasil.textContent = "Nilai B";
                    hasil.style.color = "yellow";
                } else {
                    if (nilai >= 65) {
                        hasil.textContent = "Nilai C";
                        hasil.style.color = "brown";
                    } else {
                        if (nilai >= 50) {
                            hasil.textContent = "Nilai D";
                            hasil.style.color = "purple";
                        } else {
                            hasil.textContent = "Nilai E";
                            hasil.style.color = "red";
        }
            }
      }
    }
        }

        function resetNilai() {
            document.getElementById("nilai_mahasiswa").value = "";
            document.getElementById("hasil_konve").textContent = "";
        }
    </script>

</body>
</html>
